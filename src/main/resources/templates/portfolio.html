<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Portfolio</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-logo">FX Trader</div>
        <nav>
            <a href="/dashboard" class="nav-item">Overview</a>
            <a href="/trade" class="nav-item">Trade</a>
            <a href="/portfolio" class="nav-item active">Portfolio</a>
            <a href="/history" class="nav-item">History</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="welcome-block">
            <span class="tag">PORTFOLIO</span>
            <h1>Open Positions</h1>
        </div>

        <div class="panel">
            <table class="rates-table">
                <thead>
                   <tr>
                       <th>Pair</th>
                       <th>Direction</th>
                       <th>Amount</th>
                       <th>Open Price</th>
                       <th>P/L</th>
                       <th></th>
                   </tr>
                </thead>
                <tbody>
                    <tr th:each="entry : ${tradesWithProfit}">
                        <td th:text="${entry.key.pair}"></td>
                        <td th:text="${entry.key.direction}"></td>
                        <td th:text="'$' + ${entry.key.amount}"></td>
                        <td th:text="${entry.key.openPrice}"></td>
                        <td th:text="'$' +${#numbers.formatDecimal(entry.value, 1, 2)}"
                            th:class="${entry.value >= 0} ? 'profit-positive' : 'profit-negative'">
                        </td>
                        <td>
                           <form th:action="@{/portfolio/close}" method="post">
                               <input type="hidden" name="tradeId" th:value="${entry.key.id}">
                               <button type="submit" class="btn-close">Close</button>
                           </form>
                        </td>
                    </tr>
                    <tr th:if="${tradesWithProfit.isEmpty()}">
                        <td colspan="6" style="color: #9ca3af; text-align: center;">No open positions yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

</body>
</html>
