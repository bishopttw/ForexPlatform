<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="auth-container">
    <div class="auth-visual">
        <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
            <polyline points="20,220 80,180 140,200 200,120 260,150 320,60 380,90"
                      fill="none" stroke="#22c55e" stroke-width="3"/>
            <rect x="70" y="150" width="12" height="60" fill="#22c55e"/>
            <rect x="130" y="170" width="12" height="40" fill="#ef4444"/>
            <rect x="190" y="90" width="12" height="90" fill="#22c55e"/>
            <rect x="250" y="120" width="12" height="60" fill="#ef4444"/>
            <rect x="310" y="40" width="12" height="80" fill="#22c55e"/>
        </svg>
        <h2>Start Trading Today</h2>
        <p>Practice with real market rates, zero real risk.</p>
    </div>

    <div class="auth-form">
        <h1>Create Account</h1>
        <p th:if="${error}" th:text="${error}" class="error-msg"></p>
        <form th:action="@{/register}" method="post">

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Username</label>
            <input type="text" name="username" maxlength="10" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>
        <p class="switch-link">Already have an account? <a th:href="@{/login}">Log in </a></p>
    </div>
</div>

</body>
</html>
